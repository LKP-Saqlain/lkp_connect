<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Insurance Contest Playbook: HDFC Life, Tata AIA, Bajaj Life</title>
    <style>
      :root {
        --page: #f4f5f7;
        --main: #f8f9fb;
        --card: #ffffff;
        --ink: #1b2430;
        --ink2: #4a5563;
        --ink3: #747e8e;
        --line: #ebebeb;
        --blue: #185fa5;
        --blue-d: #0c447c;
        --green: #1d9e75;
        --red: #e24b4a;
        --amber: #ba7517;
        --on-blue: #ffffff;
        --blue-t: #e8f0f9;
        --green-t: #e5f5ee;
        --amber-t: #f8efe1;
        --red-t: #fcecec;
        --shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
        --hdfc: var(--blue);
        --hdfc-t: var(--blue-t);
        --tata: var(--green);
        --tata-t: var(--green-t);
        --bajaj: var(--amber);
        --bajaj-t: var(--amber-t);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --page: #0e1217;
          --main: #11161c;
          --card: #182029;
          --ink: #e7ebf0;
          --ink2: #b6bfcb;
          --ink3: #8c97a6;
          --line: #27313c;
          --blue: #62a1dd;
          --blue-d: #93bee8;
          --green: #3ec394;
          --red: #f07a79;
          --amber: #dda552;
          --on-blue: #0e1217;
          --blue-t: #192a3d;
          --green-t: #14302a;
          --amber-t: #33291a;
          --red-t: #3a1f20;
          --shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --page: #0e1217;
        --main: #11161c;
        --card: #182029;
        --ink: #e7ebf0;
        --ink2: #b6bfcb;
        --ink3: #8c97a6;
        --line: #27313c;
        --blue: #62a1dd;
        --blue-d: #93bee8;
        --green: #3ec394;
        --red: #f07a79;
        --amber: #dda552;
        --on-blue: #0e1217;
        --blue-t: #192a3d;
        --green-t: #14302a;
        --amber-t: #33291a;
        --red-t: #3a1f20;
        --shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
        color-scheme: dark;
      }
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        -webkit-text-size-adjust: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font:
          14.5px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      img {
        max-width: 100%;
      }
      a {
        color: var(--blue);
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
        border-radius: 6px;
      }
      h1,
      h2,
      h3,
      h4 {
        margin: 0;
        line-height: 1.2;
        color: var(--ink);
      }
      p {
        margin: 0;
      }

      /* Shell */
      .shell {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
      }
      .side {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        align-self: start;
        height: calc(
          100vh - env(safe-area-inset-top, 0px) -
            env(safe-area-inset-bottom, 0px)
        );
        overflow: auto;
        background: var(--card);
        border-right: 1px solid var(--line);
        padding: 20px 14px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 6px;
      }
      .logo {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--blue);
        color: var(--on-blue);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      .brand strong {
        display: block;
        font-size: 14.5px;
      }
      .brand span {
        display: block;
        font-size: 12px;
        color: var(--ink3);
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav button {
        all: unset;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 10px;
        border-radius: 9px;
        font-size: 14px;
        font-weight: 550;
        color: var(--ink2);
      }
      .nav button:hover {
        background: var(--page);
      }
      .nav button[aria-current="page"] {
        background: var(--blue-t);
        color: var(--blue);
      }
      .nav button:focus-visible,
      .side .insq:focus-visible,
      .linkbtn:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      .count-pill {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink3);
        background: var(--page);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .nav button[aria-current="page"] .count-pill {
        background: var(--card);
        color: var(--blue);
      }
      .side h4 {
        font-size: 12px;
        color: var(--ink3);
        font-weight: 600;
        padding: 0 10px 6px;
      }
      .side .insq {
        all: unset;
        cursor: pointer;
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 7px 10px;
        border-radius: 9px;
        font-size: 13.5px;
        color: var(--ink2);
      }
      .side .insq:hover {
        background: var(--page);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
      }
      .dot.h {
        background: var(--hdfc);
      }
      .dot.t {
        background: var(--tata);
      }
      .dot.b {
        background: var(--bajaj);
      }
      .side-foot {
        margin-top: auto;
        font-size: 12px;
        color: var(--ink3);
        padding: 0 10px;
        line-height: 1.5;
      }
      .scrim {
        display: none;
      }
      main {
        min-width: 0;
        background: var(--main);
        padding: 26px 30px 130px;
        min-height: 100vh;
      }
      .topbar {
        display: none;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      /* Cards and common */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .pad {
        padding: 22px 24px;
      }
      .muted {
        color: var(--ink3);
      }
      .small {
        font-size: 12.5px;
      }
      .btn {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        padding: 7px 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        line-height: 1.3;
      }
      .btn:hover {
        border-color: var(--ink3);
      }
      .btn.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: var(--on-blue);
      }
      .btn.primary:hover {
        background: var(--blue-d);
        border-color: var(--blue-d);
      }
      .btn.cmp[aria-pressed="true"] {
        background: var(--blue-t);
        border-color: var(--blue);
        color: var(--blue);
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .linkbtn {
        all: unset;
        cursor: pointer;
        color: var(--blue);
        font-weight: 600;
        font-size: 13.5px;
      }
      .linkbtn:hover {
        text-decoration: underline;
      }
      .ins {
        font-size: 12px;
        font-weight: 650;
        padding: 2px 9px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .ins.h {
        color: var(--hdfc);
        background: var(--hdfc-t);
      }
      .ins.t {
        color: var(--tata);
        background: var(--tata-t);
      }
      .ins.b {
        color: var(--bajaj);
        background: var(--bajaj-t);
      }
      .cat {
        font-size: 12px;
        color: var(--ink2);
        white-space: nowrap;
      }
      .tag {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ink2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 8px;
        white-space: nowrap;
      }
      .tag.new {
        color: var(--green);
        border-color: var(--green);
      }
      .sec-title {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 12px;
        flex-wrap: wrap;
      }
      .sec-title h2 {
        font-size: 20px;
        letter-spacing: -0.005em;
      }
      .sec-title p {
        color: var(--ink2);
        max-width: 70ch;
        margin-top: 4px;
      }

      /* Hero */
      .hero {
        padding: 30px 30px 26px;
        border-radius: 14px;
      }
      .hero h1 {
        font-size: clamp(26px, 3.4vw, 36px);
        letter-spacing: -0.02em;
        font-weight: 750;
        max-width: 22ch;
      }
      .hero .lede {
        color: var(--ink2);
        max-width: 62ch;
        margin-top: 10px;
        font-size: 15px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }
      .chip {
        font: inherit;
        font-size: 13.5px;
        font-weight: 550;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink2);
        border-radius: 999px;
        padding: 7px 14px;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--ink3);
      }
      .chip[aria-checked="true"],
      .chip[aria-pressed="true"] {
        background: var(--ink);
        color: var(--card);
        border-color: var(--ink);
      }
      .picks {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 14px;
        margin-top: 22px;
      }
      .pick {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 16px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--main);
      }
      .pick.h {
        border-top: 3px solid var(--hdfc);
      }
      .pick.t {
        border-top: 3px solid var(--tata);
      }
      .pick.b {
        border-top: 3px solid var(--bajaj);
      }
      .pick h3 {
        font-size: 16.5px;
      }
      .pick p {
        font-size: 13.5px;
        color: var(--ink2);
      }
      .pick .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: auto;
        padding-top: 6px;
      }
      .hero-foot {
        margin-top: 16px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* Insurer strip */
      .istrip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .icard {
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .icard.h {
        border-left: 4px solid var(--hdfc);
      }
      .icard.t {
        border-left: 4px solid var(--tata);
      }
      .icard.b {
        border-left: 4px solid var(--bajaj);
      }
      .icard h3 {
        font-size: 16px;
      }
      .icard .csr {
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -0.01em;
      }
      .icard .csr small {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink3);
        margin-left: 6px;
      }
      .icard p {
        font-size: 13px;
        color: var(--ink2);
      }
      .icard .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      .tips {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
        margin-top: 14px;
      }
      .tip {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        background: var(--main);
      }
      .tip h4 {
        font-size: 14px;
        margin-bottom: 4px;
      }
      .tip p {
        font-size: 13.2px;
        color: var(--ink2);
      }

      /* Library */
      .filters {
        padding: 16px 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        align-items: center;
      }
      .search {
        flex: 1 1 260px;
        min-width: 200px;
        font: inherit;
        font-size: 14px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--main);
        color: var(--ink);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
        background: var(--main);
      }
      .seg button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        border: 0;
        background: transparent;
        color: var(--ink2);
        padding: 8px 12px;
        cursor: pointer;
        border-right: 1px solid var(--line);
      }
      .seg button:last-child {
        border-right: 0;
      }
      .seg button[aria-pressed="true"] {
        background: var(--card);
        color: var(--blue);
        box-shadow: inset 0 -2px 0 var(--blue);
      }
      select {
        font: inherit;
        font-size: 13.5px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--main);
        color: var(--ink);
      }
      .check {
        display: inline-flex;
        gap: 7px;
        align-items: center;
        font-size: 13.5px;
        color: var(--ink2);
        cursor: pointer;
      }
      .result-line {
        font-size: 13px;
        color: var(--ink3);
        padding: 0 2px;
      }
      .group h3.gh {
        font-size: 15px;
        color: var(--ink2);
        font-weight: 650;
        margin: 6px 2px 10px;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .group h3.gh span {
        font-size: 12.5px;
        color: var(--ink3);
        font-weight: 500;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 14px;
      }
      .pcard {
        padding: 16px 16px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .pcard.h {
        border-top: 3px solid var(--hdfc);
      }
      .pcard.t {
        border-top: 3px solid var(--tata);
      }
      .pcard.b {
        border-top: 3px solid var(--bajaj);
      }
      .pcard.listed {
        box-shadow: none;
      }
      .pc-top {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pcard h3 {
        font-size: 16px;
        letter-spacing: -0.005em;
      }
      .uin {
        font-size: 12px;
        color: var(--ink3);
      }
      .sum {
        font-size: 13.6px;
        color: var(--ink2);
      }
      .fit {
        font-size: 13.2px;
        color: var(--ink);
      }
      .fit b {
        font-weight: 650;
      }
      .pc-act {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: auto;
        padding-top: 6px;
        align-items: center;
      }
      .listed-note {
        font-size: 12px;
        color: var(--ink3);
      }
      .details {
        border-top: 1px solid var(--line);
        margin-top: 4px;
        padding-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .details ul {
        margin: 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13.3px;
      }
      .params {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 12px;
        font-size: 12.8px;
        margin: 0;
      }
      .params dt {
        color: var(--ink3);
      }
      .params dd {
        margin: 0;
      }
      .watch {
        font-size: 13px;
        background: var(--red-t);
        border-radius: 8px;
        padding: 8px 10px;
        color: var(--ink);
      }
      .watch b {
        color: var(--red);
      }
      .empty {
        padding: 32px;
        text-align: center;
        color: var(--ink2);
      }

      /* Compare */
      .cmp-controls {
        display: flex;
        gap: 10px 16px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 14px;
      }
      .presets {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .tablewrap {
        overflow-x: auto;
        border-radius: 12px;
      }
      .ctable {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        min-width: 760px;
        font-size: 13.3px;
      }
      .ctable th,
      .ctable td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        text-align: left;
      }
      .ctable thead th {
        background: var(--card);
        position: relative;
      }
      .ctable th.rowh {
        position: sticky;
        left: 0;
        z-index: 1;
        background: var(--card);
        width: 150px;
        min-width: 130px;
        font-size: 12.5px;
        color: var(--ink3);
        font-weight: 600;
      }
      .ctable td {
        min-width: 210px;
      }
      .ctable td.win,
      .ctable th.win {
        background: var(--green-t);
      }
      .colhead {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 190px;
      }
      .colhead h3 {
        font-size: 15px;
      }
      .colhead .x {
        position: absolute;
        top: 8px;
        right: 8px;
        border: 0;
        background: transparent;
        color: var(--ink3);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 6px;
      }
      .colhead .x:hover {
        color: var(--red);
        background: var(--red-t);
      }
      .pickbadge {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--green);
        border: 1px solid var(--green);
        border-radius: 999px;
        padding: 1px 8px;
        align-self: flex-start;
      }
      .ctable ul {
        margin: 0;
        padding-left: 16px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .bars {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 170px;
      }
      .barrow {
        display: grid;
        grid-template-columns: 96px 1fr 20px;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--ink2);
      }
      .bar {
        height: 7px;
        background: var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--blue);
        border-radius: 4px;
      }
      .total {
        font-size: 18px;
        font-weight: 750;
      }
      .verdict {
        padding: 22px 24px;
        border-left: 4px solid var(--green);
      }
      .verdict h2 {
        font-size: 19px;
      }
      .verdict .lead {
        font-size: 14.5px;
        margin-top: 8px;
        max-width: 78ch;
      }
      .verdict ul {
        margin: 10px 0 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 80ch;
      }
      .warn {
        margin-top: 12px;
        background: var(--amber-t);
        border-radius: 9px;
        padding: 10px 12px;
        font-size: 13.2px;
        max-width: 80ch;
      }
      .cmp-empty {
        padding: 34px 24px;
        text-align: center;
      }
      .cmp-empty h3 {
        font-size: 17px;
      }
      .cmp-empty p {
        color: var(--ink2);
        margin: 6px auto 16px;
        max-width: 52ch;
      }

      /* Verdict page */
      .vblock {
        padding: 22px 24px;
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: 22px;
      }
      .vblock h3 {
        font-size: 13px;
        color: var(--ink3);
        font-weight: 600;
        margin-bottom: 6px;
      }
      .vwin h4 {
        font-size: 19px;
        letter-spacing: -0.01em;
        margin: 6px 0 8px;
      }
      .vwin p {
        color: var(--ink2);
        font-size: 14px;

        if (!items.length) return "balanced";

          .slice()
          .sort((a, b) => rankScore(b, pri) - rankScore(a, pri));

          rest = ranked.slice(1);
        const raw = items.map((p) => scoreOf(p, pri));
        const top = scoreOf(win, pri);
        const second = rest.length
          ? Math.max(...rest.map((p) => scoreOf(p, pri)))
          : null;

      /* ---------- Tray ---------- */
      function renderTray() {
        const t = $("#tray");
        if (!state.sel.length || state.view === "compare") {
          t.classList.remove("show");
          t.innerHTML = "";
          return;
        }
        t.innerHTML = `<span class="lbl">${state.sel.length} of 4 in compare</span>
    <div class="sel">${state.sel.map((id) => `<span class="tchip"><span>${esc(BY[id].n)}</span><button data-cmp="${id}" aria-label="Remove ${esc(BY[id].n)}">×</button></span>`).join("")}</div>
    <button class="btn primary" data-go="compare">${state.sel.length > 1 ? "Compare now" : "Add one more to compare"}</button>`;
        t.classList.add("show");
      }

      /* ---------- Render + events ---------- */
      function render() {
        updateNav();
        ({
          overview: renderOverview,
          library: renderLibrary,
          compare: renderCompare,
          verdict: renderVerdict,
        })[state.view]();
        renderTray();
      }
      function refreshCmpButtons(id) {
        document.querySelectorAll(`[data-cmp="${id}"].cmp`).forEach((b) => {
          const on = state.sel.includes(id);
          b.setAttribute("aria-pressed", on);
          b.textContent = on ? "In compare" : "Add to compare";
        });
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("button,a");
        if (!b) return;
        const d = b.dataset;
        if (d.view) {
          go(d.view);
          return;
        }
        if (d.go) {
          go(d.go);
          return;
        }
        if (d.ins && b.classList.contains("insq")) {
          go("library", {
            ins: d.ins,
            cat: "all",
            who: "all",
            q: "",
            profiled: false,
          });
          return;
        }
        if (d.persona) {
          state.persona = d.persona;
          renderOverview();
          const c = document.querySelector(`[data-persona="${d.persona}"]`);
          if (c) c.focus();
          return;
        }
        if (d.libwho) {
          go("library", {
            who: d.libwho,
            ins: "all",
            cat: "all",
            q: "",
            profiled: false,
          });
          return;
        }
        if (d.libins) {
          go("library", {
            ins: d.libins,
            who: "all",
            cat: "all",
            q: "",
            profiled: false,
          });
          return;
        }
        if (d.openlib) {
          const p = BY[d.openlib];
          state.open.add(p.id);
          go("library", {
            ins: p.ins,
            cat: p.cat,
            who: "all",
            q: "",
            profiled: false,
          });
          setTimeout(() => {
            const c = document.getElementById("card-" + p.id);
            if (c) c.scrollIntoView({ block: "center" });
          }, 30);
          return;
        }
        if (d.toggle) {
          state.open.has(d.toggle)
            ? state.open.delete(d.toggle)
            : state.open.add(d.toggle);
          const c = document.getElementById("card-" + d.toggle);
          if (c) {
            c.outerHTML = cardHTML(BY[d.toggle]);
            const n = document.querySelector(`#card-${d.toggle} [data-toggle]`);
            if (n) n.focus();
          }
          return;
        }
        if (d.cmp) {
          const ok = toggleSel(d.cmp);
          if (ok === false) return;
          if (state.view === "compare") renderCompare();
          else refreshCmpButtons(d.cmp);
          return;
        }
        if (d.fins) {
          state.ins = d.fins;
          document
            .querySelectorAll("[data-fins]")
            .forEach((x) =>
              x.setAttribute("aria-pressed", x.dataset.fins === state.ins),
            );
          renderResults();
          return;
        }
        if (d.preset) {
          const x = PRESETS.find((p) => p.key === d.preset);
          state.sel = x.ids.slice();
          state.pri = "auto";
          saveSel();
          updateNav();
          renderCompare();
          return;
        }
        if (d.presetGo) {
          const x = PRESETS.find((p) => p.key === d.presetGo);
          state.sel = x.ids.slice();
          state.pri = "auto";
          saveSel();
          go("compare");
          return;
        }
        if (d.clear) {
          state.sel = [];
          saveSel();
          updateNav();
          renderCompare();
          return;
        }
      });
      $("#burger").addEventListener("click", () => {
        const s = $("#side");
        const open = !s.classList.contains("open");
        s.classList.toggle("open", open);
        $("#scrim").classList.toggle("show", open);
        $("#burger").setAttribute("aria-expanded", String(open));
      });
      $("#scrim").addEventListener("click", closeMenu);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenu();
      });
      render();
    </script>
